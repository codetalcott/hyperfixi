name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - current
          - patch
          - minor
          - major
          - prerelease
        default: 'current'
      npm-tag:
        description: 'npm dist-tag (latest, beta, next, etc.)'
        required: true
        type: string
        default: 'latest'
      dry-run:
        description: 'Dry run (do not actually publish)'
        required: false
        type: boolean
        default: false
      packages:
        description: 'Packages: "all", or a comma-separated subset by directory name (domain-learn) or npm name (@lokascript/domain-learn). A filter matching nothing fails the run.'
        required: false
        type: string
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
      id-token: write # Required for npm trusted publishing (OIDC provenance)
      pull-requests: write # Fallback: open a PR when main is push-protected

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          # No auth-token — OIDC trusted publishing handles authentication

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          # npm ci reproduces the committed lockfile tree exactly — the same tree
          # CI validates on every push. This step previously deleted the lockfile
          # and ran an unpinned `npm install`, which resolved a fresh tree from
          # the registry and broke whenever upstream releases shifted hoisting
          # (the 2026-07-13 i18n vite-types DTS failure: the fresh tree stopped
          # nesting vite 8 under packages/i18n while the lockfile tree, green on
          # every CI push, keeps it). The lockfile stays valid here because the
          # commit step below now regenerates and commits it alongside version
          # bumps.
          npm ci

      - name: Build all packages
        run: |
          # Build order mirrors .github/workflows/ci.yml (which is known-green).
          # Every workspace dep is built — including the private ones
          # (domain-toolkit, mcp-multilingual-intent, developer-tools) — because
          # their dist/ must exist for tsc to resolve cross-package imports.
          # (intent and domain-config are public, published packages.)
          npm run build --prefix packages/intent
          npm run build --prefix packages/framework
          # semantic must precede the domain-* packages: their vocab modules
          # import @lokascript/semantic/languages/* (bridge migration), so
          # domain-bdd's build:types (tsc) fails without semantic's dist first.
          # Mirrors the known-green order in ci.yml (build job).
          npm run build --prefix packages/semantic
          npm run build --prefix packages/domain-bdd
          npm run build --prefix packages/domain-sql
          npm run build --prefix packages/domain-jsx
          npm run build --prefix packages/domain-todo
          npm run build --prefix packages/domain-behaviorspec
          npm run build --prefix packages/domain-llm
          npm run build --prefix packages/domain-flow
          npm run build --prefix packages/domain-voice
          npm run build --prefix packages/domain-learn
          npm run build --prefix packages/domain-toolkit
          npm run build --prefix packages/domain-config
          npm run build --prefix packages/behaviors
          npm run build --prefix packages/core
          npm run build --prefix packages/patterns-reference
          npm run build --prefix packages/i18n
          npm run build --prefix packages/hyperscript-adapter
          npm run build --prefix packages/aot-compiler
          npm run build --prefix packages/compilation-service
          npm run build --prefix packages/planner
          npm run build --prefix packages/mcp-server
          npm run build --prefix packages/mcp-multilingual-intent
          npm run build --prefix packages/developer-tools
          npm run build --prefix packages/server-bridge
          npm run build --prefix packages/vite-plugin
          npm run build --prefix packages/language-server
          # Plugin packages (HyperfixiPlugin) — reactivity before components (components depends on reactivity)
          npm run build --prefix packages/reactivity
          npm run build --prefix packages/realtime
          npm run build --prefix packages/components
          npm run build --prefix packages/speech
          # intent-element depends on @lokascript/intent + @hyperfixi/core (both built above)
          npm run build --prefix packages/intent-element
          npm run build --prefix packages/types-browser
          npm run build --prefix packages/testing-framework
          npm run build --prefix packages/language-server-hyperscript
          npm run build --prefix packages/multilingual-hyperscript
          npm run build --prefix packages/hyperscript-tools-i18n
          # htmx-adapter is dependency-free (adapter for upstream htmx v4);
          # added 2026-07-21 — it shipped in #735 as a PUBLIC package but was
          # missing from this list AND from ALL_PACKAGES, so v2.8.0's dry run
          # silently skipped it (the audit's "dropped from the build-order
          # list" class, caught during the release itself).
          npm run build --prefix packages/htmx-adapter
          # Core browser bundles depend on i18n/dist/browser.js + reactivity/dist
          # and realtime/dist (browser-bundle.ts inlines both plugins)
          npm run build:browser --prefix packages/core

      - name: Run tests
        run: |
          npm test --prefix packages/core
          npm test --prefix packages/semantic -- --run
          npm test --prefix packages/i18n -- --run
          npm test --prefix packages/hyperscript-adapter -- --run
          npm test --prefix packages/hyperscript-tools-i18n
          npm test --prefix packages/compilation-service -- --run
          npm test --prefix packages/mcp-server -- --run

      # Publish-time gates (added 2026-07-20 pre-release audit). Both checks
      # previously ran only on PRs (ci.yml export-validation job) and in the
      # manual pre-publish-check dispatch — nothing in THIS workflow's path
      # stopped a dispatch from shipping a broken exports map or a
      # Node-unsafe core (dom-globals-shim ordering ahead of morphlex's
      # module-scope Element.prototype access). Runs after build:browser on
      # purpose: core's exports map includes dist/hyperfixi*.js bundles that
      # only exist once the browser bundles are built. Both commands are
      # unpiped so their exit codes gate directly.
      - name: Validate exports + bare-Node import
        run: |
          node scripts/validate-exports.mjs core semantic i18n vite-plugin mcp-server patterns-reference aot-compiler compilation-service language-server --strict
          node scripts/check-node-import.mjs

      - name: Calculate new version
        id: version
        run: |
          CURRENT=$(node -p "require('./packages/core/package.json').version")
          echo "Current version: $CURRENT"
          VERSION_TYPE="${{ github.event.inputs.version-type }}"

          if [ "$VERSION_TYPE" = "current" ]; then
            NEW="$CURRENT"
          else
            cd packages/core
            npm version "$VERSION_TYPE" --no-git-tag-version > /dev/null 2>&1
            NEW=$(node -p "require('./package.json').version")
            cd ../..
            git checkout packages/core/package.json
          fi

          echo "New version: $NEW"
          echo "version=$NEW" >> $GITHUB_OUTPUT

      - name: Sync all package versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Setting all packages to $VERSION (and internal dep ranges to ^$VERSION)"
          # set-version.cjs bumps every package + root + lerna.json AND rewrites
          # internal workspace dep ranges to ^VERSION — so published tarballs
          # carry accurate constraints (npm has no workspace: protocol).
          node scripts/set-version.cjs "$VERSION"

      - name: Stage CHANGELOG into each package
        run: |
          # Every publishable package lists CHANGELOG.md in `files`; this puts the
          # root changelog there for the packages that don't maintain their own,
          # so consumers can read what changed without probing installed code.
          # The copies are gitignored and the release commit below adds explicit
          # paths only, so they never enter the repo.
          node scripts/sync-changelogs.cjs

      - name: Publish packages
        id: publish
        env:
          # NPM_TOKEN required for initial publish of new packages
          # (OIDC trusted publishing only works for packages already on npm)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DRY_RUN="${{ github.event.inputs.dry-run }}"
          FILTER="${{ github.event.inputs.packages }}"
          FAILED=""

          # All packages in dependency order
          # Packages that have version-lock with core use the same VERSION
          # New domain/framework packages start at 1.0.0 but will be bumped if VERSION_TYPE != current
          # Plugin packages (reactivity, components, speech) listed after behaviors
          # because components depends on reactivity; both depend on @hyperfixi/core
          # (which is in position 2). speech depends on core only.
          # intent is first — @hyperfixi/core and @lokascript/framework depend on it.
          # domain-config sits after the domain-* packages + framework (its deps).
          # planner sits before mcp-server (which depends on it).
          # intent-element depends on intent + core, so it follows them.
          ALL_PACKAGES="intent semantic core i18n hyperscript-adapter patterns-reference \
                        framework server-bridge types-browser aot-compiler \
                        domain-sql domain-bdd domain-llm domain-todo domain-behaviorspec domain-jsx domain-flow domain-voice domain-learn domain-config \
                        compilation-service planner mcp-server vite-plugin \
                        behaviors reactivity realtime components speech intent-element testing-framework language-server \
                        language-server-hyperscript multilingual-hyperscript \
                        hyperscript-tools-i18n htmx-adapter"

          # A filter entry may be either the DIRECTORY name (`domain-learn`) or the
          # npm name (`@lokascript/domain-learn`). It used to match the npm name
          # only, while the sibling pre-publish-check workflow takes directory
          # names for an identically-described input — so passing directory names
          # here silently matched NOTHING, published zero packages, and still
          # reported success. That happened for real on the 2.9.0 release and cost
          # a full cycle. MATCHED counts what survives the filter; the guard after
          # the loop turns "matched nothing" into a hard failure.
          MATCHED=0

          for pkg in $ALL_PACKAGES; do
            [ ! -f "packages/$pkg/package.json" ] && continue

            # Skip if not in filter (unless filter is "all")
            if [ "$FILTER" != "all" ]; then
              PKG_NAME=$(node -p "require('./packages/$pkg/package.json').name")
              # Exact match on either form, comma-delimited so `domain-learn`
              # cannot also match `domain-learn-extras`.
              echo ",$FILTER," | grep -qF ",$pkg," || \
                echo ",$FILTER," | grep -qF ",$PKG_NAME," || continue
            fi
            MATCHED=$((MATCHED + 1))

            PKG_NAME=$(node -p "require('./packages/$pkg/package.json').name")
            PKG_VER=$(node -p "require('./packages/$pkg/package.json').version")
            IS_PRIVATE=$(node -p "require('./packages/$pkg/package.json').private || false")
            [ "$IS_PRIVATE" = "true" ] && continue

            echo "→ $PKG_NAME@$PKG_VER"

            if [ "$DRY_RUN" = "true" ]; then
              (cd "packages/$pkg" && npm publish --dry-run --access public \
                --tag "${{ github.event.inputs.npm-tag }}" 2>&1 | tail -3) || true
            else
              (cd "packages/$pkg" && npm publish --access public --provenance \
                --tag "${{ github.event.inputs.npm-tag }}" 2>&1 | tee /tmp/pub-$pkg.log) || {
                if grep -q "previously published\|already exists\|cannot publish over" /tmp/pub-$pkg.log 2>/dev/null; then
                  echo "  ⏭ already published, skipping"
                elif grep -q "Scope not found" /tmp/pub-$pkg.log 2>/dev/null; then
                  echo "  ⚠ scope not found on npm — create @${PKG_NAME%%/*} scope first"
                else
                  echo "  ✗ FAILED"
                  FAILED="$FAILED $PKG_NAME"
                fi
              }
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "::error::Failed:$FAILED"
            exit 1
          fi

          # A filter that matches nothing is always a mistake — a typo, or the
          # wrong naming convention — and used to pass as a green no-op that
          # still cut a tag and a GitHub Release. Fail loudly instead.
          if [ "$MATCHED" -eq 0 ]; then
            echo "::error::packages filter '$FILTER' matched none of ALL_PACKAGES — nothing was published. Use directory names (domain-learn) or npm names (@lokascript/domain-learn), comma-separated."
            exit 1
          fi
          echo "published=$MATCHED" >> $GITHUB_OUTPUT
          echo "✓ $MATCHED package(s) processed"

          # Export the canonical list so the Summary step cannot drift from it.
          # It had: the Summary loop carried its own hardcoded copy that was
          # seven packages behind (intent, domain-config, planner, realtime,
          # components, speech, intent-element were all published and none of
          # them appeared in the summary).
          echo "all_packages=$(echo $ALL_PACKAGES | tr -s '[:space:]' ' ')" >> $GITHUB_OUTPUT

      # The bump step below only runs for a REAL release, so the credential it
      # depends on was untestable until packages were already on npm — which is
      # precisely how v2.9.1 broke (RELEASE_BUMP_TOKEN denied, both landing paths
      # failed, main left a version behind). A dry run now proves the token can
      # push before anyone commits to a release.
      #
      # `origin/main:main` pushes the commit that is ALREADY on main, so this is
      # a genuine no-op ("Everything up-to-date") when permitted, and the same
      # denial when not. It cannot move the branch.
      #
      # Non-fatal on purpose: a dry run's job is to report, and a missing token
      # is a valid configuration (the PR fallback exists for it). The warning is
      # loud because that fallback stalls — PRs opened with GITHUB_TOKEN do not
      # trigger CI, so main's required checks never start and auto-merge never
      # fires.
      - name: Verify RELEASE_BUMP_TOKEN can push (dry run only)
        if: ${{ github.event.inputs.dry-run == 'true' }}
        env:
          RELEASE_BUMP_TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$RELEASE_BUMP_TOKEN" ]; then
            echo "::warning::RELEASE_BUMP_TOKEN is not set. A real release will fall back to a release-bump PR, which stalls: PRs opened with GITHUB_TOKEN do not trigger CI, so the required checks never start and auto-merge never fires. Expect to land the bump by hand."
            exit 0
          fi

          BRANCH="${{ github.ref_name }}"
          # FETCH_HEAD rather than origin/$BRANCH: actions/checkout does a
          # shallow single-ref fetch, so the remote-tracking ref is not
          # guaranteed to exist, but FETCH_HEAD always is.
          git fetch origin "$BRANCH" --quiet

          # actions/checkout persists GITHUB_TOKEN as an http.extraheader that
          # silently overrides URL credentials — clear it so we test the token
          # we actually mean to test.
          if git -c http.https://github.com/.extraheader= \
              push "https://x-access-token:${RELEASE_BUMP_TOKEN}@github.com/${{ github.repository }}.git" \
              "FETCH_HEAD:${BRANCH}" 2>&1 | tee /tmp/token-check.log; then
            echo "✓ RELEASE_BUMP_TOKEN can push to $BRANCH — a real release will land its bump directly."
            # A green result here is only as strong as the branch it pushed to.
            # An unprotected branch needs Contents: write and nothing else;
            # main additionally needs the token's identity to bypass the six
            # required checks (possible only because enforce_admins is off).
            # Passing on a feature branch therefore does NOT prove a release
            # dispatched on main will land — say so, rather than let a ✓ imply it.
            if [ "$BRANCH" != "main" ]; then
              echo "::notice::That check ran against '$BRANCH', which is not branch-protected. It proves the token has Contents: write, but NOT that it can push to main past its required checks. Re-run this dry run with the workflow dispatched on main for the definitive answer."
            fi
          else
            echo "::warning::RELEASE_BUMP_TOKEN cannot push to $BRANCH. For a fine-grained PAT, check that Repository access includes ${{ github.repository }} AND Permissions -> Repository -> Contents is 'Read and write'; for a classic PAT, the 'repo' scope. A real release would fall back to a release-bump PR, which stalls on required checks that never start."
          fi

      - name: Commit version changes
        id: bump
        # When version-type=current, the bump was already committed by hand
        # before this workflow was dispatched — there is nothing to commit
        # here, and running the step risks corrupting state (see lockfile
        # handling below). Skip cleanly so tags + release still run.
        if: ${{ github.event.inputs.dry-run == 'false' && github.event.inputs.version-type != 'current' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BUMP_TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN }}
        run: |
          # pipefail so a `cmd | tee` below reports cmd's status, not tee's.
          # The publish step above already sets this.
          set -o pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ github.ref_name }}"

          # Regenerate the lockfile so its workspace version stamps match the
          # bumped package.jsons, and commit it WITH the bump — that is what
          # keeps `npm ci` (install step above) valid for every subsequent
          # run. --package-lock-only rewrites the lockfile from the current
          # package.jsons without touching node_modules; registry resolutions
          # already satisfied by the existing lockfile are kept.
          npm install --package-lock-only

          git add packages/*/package.json package.json lerna.json package-lock.json 2>/dev/null || true

          # `git commit || echo "No changes to commit"` masked two very different
          # things: a legitimately empty diff, and a commit that actually failed.
          # Decide which case we are in up front.
          if git diff --cached --quiet; then
            echo "::warning::Nothing staged for v$VERSION — the bump appears to be committed already."
          else
            git commit -m "chore: release v$VERSION"
          fi

          # Pull from the SAME branch the workflow ran on, not hardcoded
          # `main` — release branches (release/x.y.z) need to stay on the
          # release branch, not pull main into themselves.
          git pull --rebase origin "$BRANCH" || git pull --no-rebase origin "$BRANCH"

          # Which route actually landed the bump. Empty means none did, which is
          # what happened in v2.9.1 — and the step still exited 0.
          LANDED=""

          # main is a protected branch, so the direct push is expected to be
          # rejected unless github-actions[bot] is on the protection bypass
          # list. Fall back to a release-bump branch + PR. (This bit the
          # v2.6.0 release: packages published fine, then the push failed and
          # the bump had to be landed by hand — see PR #603.)
          # Preferred path: push with RELEASE_BUMP_TOKEN (an admin fine-grained
          # PAT). main's protection is checks-only with enforce_admins OFF, so
          # an admin-authenticated push bypasses the required checks that block
          # github-actions[bot] (a fresh release commit has no check runs).
          # actions/checkout persists GITHUB_TOKEN as an http.extraheader that
          # silently overrides URL credentials — clear it for this one push.
          if [ -n "$RELEASE_BUMP_TOKEN" ] && git -c http.https://github.com/.extraheader= \
              push "https://x-access-token:${RELEASE_BUMP_TOKEN}@github.com/${{ github.repository }}.git" \
              HEAD:"$BRANCH"; then
            echo "Pushed version bump directly to $BRANCH (release token)"
            LANDED="direct"
          elif git push origin HEAD:"$BRANCH"; then
            echo "Pushed version bump directly to $BRANCH"
            LANDED="direct"
          else
            echo "Direct push rejected (branch protection) — opening a PR instead"
            BUMP_BRANCH="release-bump/v$VERSION"
            git push -f origin HEAD:"$BUMP_BRANCH"
            PR_BODY=$(printf '%s\n\n%s' \
              "Version-bump bookkeeping for v$VERSION (packages are already on npm). Opened automatically by publish.yml because $BRANCH is push-protected." \
              "NOTE: PRs created with GITHUB_TOKEN do not trigger CI. If required checks stay pending, close and reopen this PR (or push an empty commit) to start them, then merge.")

            # `gh pr create || echo "PR already exists"` masked the real v2.9.1
            # failure: "GitHub Actions is not permitted to create or approve pull
            # requests" (a repo SETTING, not a token scope) was reported as a
            # benign duplicate, and the job went green while main stayed on the
            # previous version. Tolerate ONLY a genuine duplicate.
            if PR_OUT=$(gh pr create --base "$BRANCH" --head "$BUMP_BRANCH" \
                  --title "chore: release v$VERSION" --body "$PR_BODY" 2>&1); then
              echo "$PR_OUT"
              LANDED="pr"
            elif printf '%s' "$PR_OUT" | grep -qi 'already exists'; then
              echo "PR already exists for $BUMP_BRANCH"
              LANDED="pr"
            else
              printf '%s\n' "$PR_OUT"
              echo "::error::gh pr create failed for $BUMP_BRANCH. If this says 'GitHub Actions is not permitted to create or approve pull requests', enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests'. Packages for v$VERSION are ALREADY ON NPM — land $BUMP_BRANCH by hand."
              exit 1
            fi

            # Auto-merge fires once required checks pass (needs repo
            # auto-merge enabled + checks started per the note above). This one
            # stays non-fatal: a human merging the PR is an acceptable outcome,
            # and the PR itself is the durable record.
            gh pr merge "$BUMP_BRANCH" --auto --squash \
              || echo "::warning::Auto-merge unavailable — merge the release-bump PR manually"
          fi

          # Post-condition. Neither route is allowed to end in "nothing
          # happened": the v2.9.1 run reached this point with both paths failed
          # and still exited 0, leaving npm on 2.9.1 and main on 2.9.0.
          if [ -z "$LANDED" ]; then
            echo "::error::v$VERSION was published to npm but the version bump did not land on $BRANCH and no PR was opened."
            exit 1
          fi

          # Only a direct push means $BRANCH carries the bump NOW; a PR is
          # pending and will squash to a different commit. The tag step reads this.
          echo "landed=$LANDED" >> $GITHUB_OUTPUT
          echo "release_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Create Git tags
        # Only a FULL run cuts release artifacts. A subset dispatch is a repair
        # (finishing a partial publish, re-pushing one package), and tagging from
        # one would overwrite the real release's tag with a partial one. On the
        # 2.9.0 release a subset run that published ZERO packages still cut the
        # tag and a Release marked Latest — a tag is not evidence a release
        # happened, and this is half of why. The other half is the zero-match
        # guard in the publish step.
        if: ${{ github.event.inputs.dry-run == 'false' && github.event.inputs.packages == 'all' }}
        run: |
          set -o pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          LANDED="${{ steps.bump.outputs.landed }}"
          RELEASE_SHA="${{ steps.bump.outputs.release_sha }}"

          # `git tag -f "v$VERSION"` tagged local HEAD unconditionally. On the
          # PR-fallback path local HEAD only exists on release-bump/vX.Y.Z — it
          # is NOT on $BRANCH, and because that PR is squash-merged it never
          # becomes an ancestor of $BRANCH either. The tag would dangle forever.
          #
          # An empty LANDED means the bump step was skipped entirely
          # (version-type=current, where the bump was committed by hand before
          # dispatch); HEAD is the right thing to tag there.
          if [ "$LANDED" = "direct" ] || [ -z "$LANDED" ]; then
            git tag -f "v$VERSION" "${RELEASE_SHA:-HEAD}"
            git push origin "v$VERSION" --force
          else
            echo "::warning::Skipping tag v$VERSION — the bump is still an open PR (release-bump/v$VERSION) and its squash-merge will produce a different commit. After merging: git tag v$VERSION <merge-sha> && git push origin v$VERSION"
          fi

      - name: Create GitHub Release
        # Same gate as the tag above — a repair run must not re-cut the Release.
        if: ${{ github.event.inputs.dry-run == 'false' && github.event.inputs.packages == 'all' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.event.inputs.npm-tag }}"
          PRERELEASE=$( [ "$TAG" != "latest" ] && echo "--prerelease" || echo "" )
          gh release create "v$VERSION" \
            --title "v$VERSION" $PRERELEASE \
            --generate-notes || echo "Release already exists"

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Publication Summary"
            echo "**Version**: $VERSION | **Tag**: ${{ github.event.inputs.npm-tag }} | **Dry run**: ${{ github.event.inputs.dry-run }}"
            echo ""
            echo "### Packages published"
            # Derived from ALL_PACKAGES in the publish step rather than copied.
            # The copy that used to live here had drifted seven packages behind
            # (intent, domain-config, planner, realtime, components, speech,
            # intent-element were published and none of them were reported) —
            # the same "second hardcoded list" class the htmx-adapter comment
            # above records from v2.8.0.
            for pkg in ${{ steps.publish.outputs.all_packages }}; do
              [ -f "packages/$pkg/package.json" ] || continue
              IS_PRIVATE=$(node -p "require('./packages/$pkg/package.json').private || false")
              [ "$IS_PRIVATE" = "true" ] && continue
              PKG_NAME=$(node -p "require('./packages/$pkg/package.json').name")
              PKG_VER=$(node -p "require('./packages/$pkg/package.json').version")
              echo "- \`$PKG_NAME@$PKG_VER\`"
            done
          } >> $GITHUB_STEP_SUMMARY

  release-smoke:
    name: Release smoke test
    needs: publish
    if: ${{ github.event.inputs.dry-run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # npm ci for the same reproducibility reason as the publish job: the
        # checkout is self-consistent (lockfile committed with version bumps),
        # so install exactly that tree rather than re-resolving from the registry.
        run: npm ci --no-audit --no-fund

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run release smoke test
        run: |
          VERSION="${{ needs.publish.outputs.version }}"
          # A fresh publish can take a few minutes to propagate across the npm
          # CDN. Retry the harness up to 3 times with a 90s backoff.
          for attempt in 1 2 3; do
            echo "::group::release-smoke attempt $attempt (v$VERSION)"
            if node examples/release-smoke/run.mjs "$VERSION"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed; waiting 90s for npm CDN propagation…"
            sleep 90
          done
          echo "::error::release smoke test failed after 3 attempts"
          exit 1
