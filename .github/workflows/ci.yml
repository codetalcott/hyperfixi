# CI workflow design notes:
#
# Goal: no PR<->push duplication, cheap doc-only PRs, and a reliable required-
# check gate — all without a merge queue (overkill for a solo maintainer).
#
#   pull_request — the authoritative gate. Runs the fast required checks
#   (build, export-validation, lint-typecheck, unit-tests) ALWAYS, plus the
#   heavy jobs (browser-tests, multilingual-validation, bundle-size, mcp-demos)
#   only when `changes.code == 'true'` (i.e. non-doc files changed). A doc-only
#   PR therefore runs just the fast required checks → reports green → mergeable,
#   while skipping the expensive jobs.
#
#   push to main / develop — the tree-skew detector ONLY: `build`. The skew
#   detectors (export-validation, lint-typecheck, unit-tests) are NOT re-run on
#   push: branch protection is `strict` (branch must be up to date), so the PR
#   already validated the exact merged result.
#
#   schedule (nightly) / workflow_dispatch — the trend jobs:
#     - build      (needed by the two below)
#     - coverage   (uploads to Codecov)
#     - benchmarks (tracks perf trends)
#   These are NOT on push. Under `strict` branch protection the post-merge tree
#   is the tree the PR validated, so running coverage there re-executed the full
#   core + semantic + i18n + language-server suites (430 files) a second time per
#   merge for a Codecov datapoint. Nightly keeps the trend and drops the
#   duplicate execution. Neither job is a gate (both are continue-on-error).
#
#   `concurrency: cancel-in-progress` means rapid pushes to a PR cancel stale
#   runs, so the heavy jobs effectively run once per PR — most of a merge
#   queue's minutes benefit, with none of its operational complexity.
name: CI

on:
  # NOTE: deliberately no workflow-level `paths-ignore`. With required status
  # checks, a paths-ignored PR skips the whole workflow, so the required checks
  # never report and the PR is blocked forever ("Expected — waiting for status").
  # Doc-only changes are handled per-job instead: the `changes` job sets
  # code=false and the heavy jobs skip on it, while the fast required checks
  # still run + report — so a docs-only PR stays cheap AND mergeable.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Nightly trend jobs (coverage + benchmarks). They used to run on every push
  # to main, which under `strict` branch protection re-ran suites the PR had
  # already run on the identical tree. Runs on the default branch.
  schedule:
    - cron: '0 6 * * *'
  # Manual trigger for the same trend jobs (also the way to verify this path
  # without waiting for the cron).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ============================================
  # Job 0: Detect which surface changed: npm stack ("code"), LSE protocol, or
  # the Go client. EVERY npm-stack job gates on `code` — `build` carries the
  # gate and the rest inherit it through `needs: build` (a skipped need skips
  # the dependent). Doc-only, protocol-only, and go-client-only diffs therefore
  # skip the whole npm fan-out; protocol/** and clients/go-client/** have their
  # own dedicated jobs below. Skipped REQUIRED checks (Build, Unit Tests, …)
  # report "skipped" and satisfy branch protection — the same mechanism the
  # required Multilingual Validation check has always relied on for doc-only
  # PRs, so nothing blocks on a skipped tier.
  # ============================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Runs on push too: `build` (push + PR) now gates on the `code` output.
    # Skipped on schedule/workflow_dispatch — dorny/paths-filter has no diff base
    # on those events, and the nightly trend jobs want to run unconditionally.
    # `build` compensates with an explicit status function (see its `if:`).
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    outputs:
      code: ${{ steps.filter.outputs.code }}
      protocol: ${{ steps.filter.outputs.protocol }}
      goclient: ${{ steps.filter.outputs.goclient }}
      docsources: ${{ steps.filter.outputs.docsources }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # REQUIRED for the `code` filter's negations to work. The default
          # quantifier is 'some' (OR over the pattern list), under which the
          # leading '**' matches every file and the '!…' lines never subtract —
          # `code` evaluated true on EVERY diff (observed live: go.mod-only
          # #664 ran the full npm stack). 'every' = a file counts only when it
          # matches ALL patterns (inside '**' AND outside each excluded set).
          # Single-positive-pattern filters (protocol, goclient) are unaffected.
          predicate-quantifier: 'every'
          # `code` is true when any changed file is OUTSIDE the doc set and
          # outside the non-npm surfaces (protocol/, clients/) that carry their
          # own jobs. `protocol` is true when the LSE spec, fixtures, or any of
          # the four reference parsers changed; `goclient` when the Go client
          # changed — both live outside the npm workspaces and are otherwise
          # never exercised by CI.
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!docs-internal/**'
              - '!examples/**'
              - '!.claude/**'
              - '!**/*.txt'
              - '!.gitignore'
              - '!LICENSE'
              - '!protocol/**'
              - '!clients/**'
            protocol:
              - 'protocol/**'
            goclient:
              - 'clients/go-client/**'
            # The trees the shipped-sources validity gate walks (its
            # DEFAULT_ROOTS). These are all EXCLUDED from `code` above, so
            # without their own filter the one gate that reads them would never
            # run on a diff that only touches them — i.e. never on the PRs most
            # likely to introduce a malformed example. Deliberately narrow: a
            # README typo elsewhere still skips the npm stack, and protocol/
            # and clients/ diffs are unaffected.
            docsources:
              - 'examples/**'
              - 'docs/**'
              - 'packages/core/docs/**'

  # ============================================
  # Job 1: Build All Packages (runs once, shared by all jobs)
  # Gated on the `code` filter: every downstream npm job `needs: build`, so a
  # diff that never touches the npm stack skips the entire fan-out here.
  # ============================================
  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # `docsources` is here so a docs/examples-only PR still produces the core
    # build the shipped-sources gate needs. Everything else downstream stays
    # gated on `code` alone, so that PR pays for one build and one small job,
    # not the full fan-out.
    #
    # The `!cancelled()` status function is REQUIRED, not cosmetic: `changes` is
    # skipped on schedule/workflow_dispatch, and without an explicit status
    # function GitHub applies an implicit `success()` to every `needs`, which
    # would skip this job (and with it the nightly coverage/benchmarks that need
    # it). `needs.changes.result != 'failure'` keeps a genuinely broken
    # classifier from silently building anyway.
    if: >-
      ${{ !cancelled()
          && needs.changes.result != 'failure'
          && (github.event_name == 'schedule'
              || github.event_name == 'workflow_dispatch'
              || needs.changes.outputs.code == 'true'
              || needs.changes.outputs.docsources == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build order based on dependency graph:
      # 1. intent (no deps — framework re-exports types from it)
      # 2. framework (depends on intent)
      # 3. semantic (depends on framework)
      # 4. core (depends on semantic)
      # 5. patterns-reference (depends on semantic)
      # 6. i18n (depends on core, semantic)
      # 7. aot-compiler (depends on core, semantic)
      # 8. compilation-service (depends on aot-compiler, semantic)
      # 9. mcp-server (depends on semantic, patterns-reference, compilation-service)
      # 10. developer-tools
      # 11. vite-plugin (depends on core)
      # 12. language-server (depends on semantic, core)
      # NOTE: `intent-element` has no downstream build consumers — skipped
      # here to keep the CI footprint small. Add it if you want CI to
      # verify its build.
      - name: Build intent package
        run: npm run build --prefix packages/intent

      - name: Build framework package
        run: npm run build --prefix packages/framework

      - name: Build semantic package
        run: npm run build --prefix packages/semantic

      # Guard against the IIFE bundle externalizing `../core` (would throw at
      # load and leave window.LokaScriptSemantic undefined). Verified at the
      # dist level — unit tests resolve to source and can't catch this.
      - name: Verify semantic bundle output
        run: bash scripts/verify-semantic-bundle.sh

      - name: Build domain-bdd package
        run: npm run build --prefix packages/domain-bdd

      - name: Build domain-sql package
        run: npm run build --prefix packages/domain-sql

      - name: Build domain-jsx package
        run: npm run build --prefix packages/domain-jsx

      - name: Build domain-todo package
        run: npm run build --prefix packages/domain-todo

      - name: Build domain-behaviorspec package
        run: npm run build --prefix packages/domain-behaviorspec

      - name: Build domain-llm package
        run: npm run build --prefix packages/domain-llm

      - name: Build domain-flow package
        run: npm run build --prefix packages/domain-flow

      - name: Build domain-voice package
        run: npm run build --prefix packages/domain-voice

      - name: Build domain-learn package
        run: npm run build --prefix packages/domain-learn

      - name: Build domain-toolkit package
        run: npm run build --prefix packages/domain-toolkit

      - name: Build domain-config package
        run: npm run build --prefix packages/domain-config

      - name: Build behaviors package
        run: npm run build --prefix packages/behaviors

      - name: Build core package (full)
        run: npm run build --prefix packages/core

      - name: Build patterns-reference package
        run: npm run build --prefix packages/patterns-reference

      - name: Build i18n package
        run: npm run build --prefix packages/i18n

      - name: Build hyperscript-adapter package
        run: npm run build --prefix packages/hyperscript-adapter

      - name: Build htmx-adapter package
        run: npm run build --prefix packages/htmx-adapter

      - name: Build aot-compiler package
        run: npm run build --prefix packages/aot-compiler

      - name: Build compilation-service package
        run: npm run build --prefix packages/compilation-service

      - name: Build planner package
        run: npm run build --prefix packages/planner

      - name: Build mcp-server package
        run: npm run build --prefix packages/mcp-server

      - name: Build mcp-multilingual-intent package
        run: npm run build --prefix packages/mcp-multilingual-intent

      - name: Build developer-tools package
        run: npm run build --prefix packages/developer-tools

      - name: Build server-bridge package
        run: npm run build --prefix packages/server-bridge

      - name: Build vite-plugin package
        run: npm run build --prefix packages/vite-plugin

      - name: Build language-server package
        run: npm run build --prefix packages/language-server

      # Plugin packages — depend on core
      - name: Build reactivity package
        run: npm run build --prefix packages/reactivity

      # realtime depends only on core; must build before the core browser
      # bundles (browser-bundle.ts inlines reactivity + realtime dists)
      - name: Build realtime package
        run: npm run build --prefix packages/realtime

      # intent-element depends on @lokascript/intent (built above) + @hyperfixi/core
      - name: Build intent-element package
        run: npm run build --prefix packages/intent-element

      # The browser bundles are NOT built here — see the `bundles` job below.
      # They were 151s of this job's 6m35s and are pure CPU work that gains
      # nothing from sharing one runner with the package builds. Measured:
      # `lite` (a 5 KB output) took 109.8s in CI against 1.7s uncontended
      # locally, because all 11 bundles were spawned concurrently onto ~4 cores.
      #
      # Note: Semantic browser bundles are already built by "npm run build" via tsup.config.ts
      # Running build:browser separately would wipe the dist folder and delete index.d.ts

      - name: Verify build output before upload
        run: |
          echo "=== Semantic dist files before upload ==="
          ls -la packages/semantic/dist/ | head -30
          echo "=== Checking for index.d.ts ==="
          ls -la packages/semantic/dist/index* || echo "No index files!"
          echo "=== File count ==="
          find packages/semantic/dist -type f | wc -l

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            packages/intent/dist/
            packages/framework/dist/
            packages/domain-bdd/dist/
            packages/domain-sql/dist/
            packages/domain-jsx/dist/
            packages/domain-todo/dist/
            packages/domain-behaviorspec/dist/
            packages/domain-llm/dist/
            packages/domain-flow/dist/
            packages/domain-voice/dist/
            packages/domain-learn/dist/
            packages/domain-toolkit/dist/
            packages/domain-config/dist/
            packages/semantic/dist/
            packages/i18n/dist/
            packages/core/dist/
            packages/behaviors/dist/
            packages/patterns-reference/dist/
            packages/hyperscript-adapter/dist/
            packages/htmx-adapter/dist/
            packages/aot-compiler/dist/
            packages/compilation-service/dist/
            packages/planner/dist/
            packages/mcp-server/dist/
            packages/mcp-multilingual-intent/dist/
            packages/developer-tools/dist/
            packages/server-bridge/dist/
            packages/vite-plugin/dist/
            packages/language-server/dist/
            packages/reactivity/dist/
            packages/realtime/dist/
            packages/intent-element/dist/
          retention-days: 3

  # ============================================
  # Job 1.2: Browser Bundles (sharded)
  #
  # Split out of `build` on 2026-07-30. It was one 151s step there, and the
  # profile showed it was CPU-starved rather than serialized: all 11 bundles
  # start together and finish within 41s of each other, tiny and huge alike —
  # `lite` (5 KB of output) took 109.8s in CI against 1.7s uncontended locally.
  # `build-browser-bundles.mjs` already runs them through `Promise.all`, so
  # there was no process-level parallelism left to add; the constraint is the
  # runner's ~4 cores. Sharding across runners is the only way to add CPU.
  #
  # Shards are balanced by MEASURED solo build cost (local, `--sequential`),
  # not by bundle count:
  #   classic-i18n 7.4s  standard 6.7  hx-v4 5.9  lite 5.5  main 5.0
  #   modular 4.8  multilingual 3.4  minimal 3.1  hybrid-hx 1.9
  #   hybrid-complete 1.8  lite-plus 1.6                    (total 47.2s)
  # → shard 1 ≈ 17.6s, shard 2 ≈ 16.9s, shard 3 ≈ 12.6s.
  #
  # If you ADD a bundle to `BUNDLES` in build-browser-bundles.mjs, add it to a
  # shard here too. `scripts/check-bundle-shards.cjs` (run in lint-typecheck and
  # from the pre-commit hook) fails on a bundle no shard claims, a shard entry
  # that is not a real bundle, and a bundle claimed twice — because `--only`
  # silently ignores unknown names, so none of those drift is self-announcing.
  # ============================================
  bundles:
    name: Browser Bundles (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # `changes` is needed for its output, not for ordering — `build` already
    # depends on it. It is skipped on schedule/dispatch, which is why the `if`
    # below opts out of GitHub's implicit success() with `!cancelled()`.
    needs: [build, changes]
    # Mirrors `build`'s gate: a docs-only PR that built core for the
    # shipped-sources gate does not need the browser bundles.
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && (github.event_name == 'schedule'
              || github.event_name == 'workflow_dispatch'
              || needs.changes.outputs.code == 'true') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            only: classic-i18n,lite,minimal,lite-plus
          - shard: 2
            only: standard,main,multilingual,hybrid-complete
          - shard: 3
            only: hybrid-hx-v4,modular,hybrid-hx

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The bundles compile core from SOURCE, but still resolve workspace deps
      # through node_modules: the main entry inlines @lokascript/semantic, and
      # #616 added the prebuilt reactivity/realtime dists. So this job needs
      # `build`'s artifacts and cannot run beside it.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Rebuild workspace links
        run: |
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      # Everything after this marker is this shard's output. See the staging
      # step below for why the shard is identified by mtime and not by name.
      - name: Mark build start
        run: touch "$RUNNER_TEMP/build-marker"

      - name: Build browser bundles (shard ${{ matrix.shard }})
        run: npm run build:browser --prefix packages/core -- --only=${{ matrix.only }}

      # Collect exactly what the build WROTE, rather than what its files are
      # NAMED. The first version of this job globbed `hyperfixi*.js` and looked
      # right: every entry in the BUNDLES map does output a `hyperfixi-*.js`.
      # But `build:browser` has a `postbuild:browser` hook —
      # `create-bundle-aliases.mjs` — which then writes v1 back-compat copies
      # under `lokascript-*.js`. The glob silently dropped every one of them,
      # and `test-multilingual-e2e.html` loads
      # `/packages/core/dist/lokascript-multilingual.js`, so eight browser tests
      # failed against a bundle that had built perfectly. `if-no-files-found`
      # could not catch it: the shard did produce matching files, just not all
      # of them.
      #
      # mtime has no such blind spot — it cannot be out of date with a rename,
      # a new alias, or a new output kind. `npm ci`/`npm install` both run
      # before the marker, so nothing they touch is picked up.
      - name: Stage produced bundles
        run: |
          cd packages/core
          staged="$RUNNER_TEMP/bundle-stage"
          rm -rf "$staged"
          count=0
          while IFS= read -r -d '' f; do
            mkdir -p "$staged/$(dirname "$f")"
            cp "$f" "$staged/$f"
            count=$((count + 1))
          done < <(find dist -type f -newer "$RUNNER_TEMP/build-marker" \
                        ! -name '*.tsbuildinfo' -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }} produced no files — the build wrote nothing."
            exit 1
          fi
          echo "staged $count file(s) from shard ${{ matrix.shard }}:"
          find "$staged" -type f | sed "s|$staged/||" | sort

      - name: Upload browser bundles
        uses: actions/upload-artifact@v7
        with:
          name: browser-bundles-${{ matrix.shard }}
          path: ${{ runner.temp }}/bundle-stage/dist
          if-no-files-found: error
          retention-days: 3

  # ============================================
  # Job 1.5: Shipped-Sources Validity
  # Every hyperscript source in examples/ and the doc trees must not parse in
  # the recovers-with-errors state (ok:true WITH a non-empty errors array) —
  # the state in which a genuinely malformed source neither throws nor reports
  # failure, which is how five of them shipped undetected.
  #
  # Its own job rather than a step in unit-tests, because it must also run on
  # docs/examples-only PRs (see the `docsources` filter): those skip `code`, so
  # a step inside unit-tests would never fire on exactly the diffs that can
  # introduce the bug. Small and fast — one vitest file over a built core.
  # ============================================
  shipped-sources:
    name: Shipped Sources Validity
    runs-on: ubuntu-latest
    needs: build
    # PR-only, same reasoning as export-validation.
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Rebuild workspace links
        run: |
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      - name: Shipped-sources validity gate
        run: npm run test:shipped-sources --prefix packages/testing-framework

  # ============================================
  # Job 2: Export Validation
  # ============================================
  export-validation:
    name: Export Validation
    runs-on: ubuntu-latest
    needs: [build, bundles, changes]
    # PR-only: `strict` branch protection means the PR validated the merged
    # result, so re-running this on the post-merge push would be redundant.
    # Also gated on `code`: package exports cannot change in a docs/examples-only
    # diff, and a skipped required check satisfies branch protection.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Download browser bundles
        uses: actions/download-artifact@v8
        with:
          # Three shards, merged back into the dist they were split out of.
          pattern: browser-bundles-*
          merge-multiple: true
          path: packages/core/dist

      - name: Rebuild workspace links
        run: |
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      - name: Validate all package exports
        run: |
          echo "## Export Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verifying package.json exports match actual dist files..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run export validation for published packages. The default job
          # shell is `bash -e` WITHOUT pipefail, so a bare `cmd | tee` here
          # reported tee's exit code and the --strict failure never gated
          # (fixed in the 2026-07-20 pre-release audit). pipefail makes the
          # pipeline carry the validator's exit; the if-guard keeps the
          # summary parsing below reachable on failure.
          #
          # This list is GUARDED by scripts/check-ci-job-lists.cjs: every
          # published package that declares an entry point and is built by the
          # `build` job must appear. It used to name eight effective packages
          # of the thirty that qualify, so twenty-two published packages could
          # ship a dangling "exports" path with nothing to catch it — and a
          # ninth argument, `aot-compiler`, was PRIVATE, which the validator
          # skips outright, so it had always been a no-op.
          set -o pipefail
          status=0
          if ! node scripts/validate-exports.mjs \
            behaviors compilation-service core \
            domain-bdd domain-behaviorspec domain-config domain-flow domain-jsx \
            domain-learn domain-llm domain-sql domain-todo domain-voice \
            framework htmx-adapter hyperscript-adapter i18n intent intent-element \
            language-server mcp-server patterns-reference planner reactivity \
            realtime semantic server-bridge vite-plugin \
            --strict 2>&1 | tee /tmp/export-validation.log; then
            status=1
          fi

          # Parse results for summary
          if grep -q "✅" /tmp/export-validation.log; then
            echo "✅ All package exports validated successfully" >> $GITHUB_STEP_SUMMARY
          fi

          if grep -q "❌" /tmp/export-validation.log; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Missing Exports" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            grep -A 10 "Missing exports" /tmp/export-validation.log >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

          exit $status

      # Bare-Node import of @hyperfixi/core (+ /commands, /behaviors): guards
      # the dom-globals shim ordering ahead of morphlex's module-scope
      # `Element.prototype` access (see packages/core/src/lib/dom-globals-shim.ts).
      - name: Bare-Node import check (core)
        run: node scripts/check-node-import.mjs

  # ============================================
  # Job 3: Lint & Typecheck
  # ============================================
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: [build, bundles, changes]
    # PR-only (see export-validation): redundant on push under `strict`.
    # Also gated on `code`: a docs/examples-only PR has nothing to lint or
    # typecheck, and a skipped required check satisfies branch protection.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # Cheap guard: zero-dep node script that verifies ci.yml builds every
      # workspace runtime dependency before its consumer. Runs before
      # `npm ci` so drift fails fast without paying install cost.
      - name: Verify CI build order
        run: node scripts/check-ci-build-order.cjs

      # Keeps the `bundles` job's hand-written shard lists in sync with the
      # BUNDLES map they shard. A bundle in neither list would simply never be
      # built in CI, and nothing downstream checks for a complete set.
      - name: Verify browser-bundle shard coverage
        run: node scripts/check-bundle-shards.cjs

      # Cheap guard: zero-dep node script that keeps scripts/test-check-all.sh
      # in sync with the workspace — both a listed-but-deleted package (which
      # makes the gate exit 1 on a green tree) and a package with tests that
      # the gate silently skips.
      - name: Verify test:check package list
        run: node scripts/check-test-check-list.cjs

      # Cheap guard: the same question asked of THIS file. The unit-test jobs
      # below enumerate their packages by hand, and #857 found one that had
      # been missing since the beginning — an express 4 → 5 major broke all 26
      # of developer-tools' tests and CI stayed green. Fails if a package with
      # a "test:check" script is in neither unit-test job.
      - name: Verify CI unit-test package list
        run: node scripts/check-ci-test-list.cjs

      # Cheap guard: the same question asked of the FOUR remaining hand-written
      # package enumerations — export-validation's arguments, the typecheck
      # lines below, the nightly coverage job (cross-checked against
      # codecov.yml's flags), and the root `lint:domains` loop. #862 guarded
      # the unit-test lists and named these four as the follow-up; when it was
      # written all four had drifted except lint:domains.
      - name: Verify CI job package lists
        run: node scripts/check-ci-job-lists.cjs

      # Cheap guard: zero-dep node script that fails if package versions have
      # drifted apart (the monorepo publishes uniformly).
      - name: Validate package versions
        run: node scripts/validate-versions.cjs

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Download browser bundles
        uses: actions/download-artifact@v8
        with:
          # Three shards, merged back into the dist they were split out of.
          pattern: browser-bundles-*
          merge-multiple: true
          path: packages/core/dist

      - name: Verify artifact extraction
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Checking semantic dist files ==="
          ls -la packages/semantic/dist/ | head -20
          echo "=== Checking for index.d.ts ==="
          ls -la packages/semantic/dist/index* || echo "No index files found!"
          echo "=== Checking all .d.ts files ==="
          find packages/semantic/dist -name "*.d.ts" -type f
          echo "=== Checking workspace symlink ==="
          ls -la node_modules/@hyperfixi/ 2>/dev/null || echo "No @hyperfixi symlinks yet"
          ls -la node_modules/@lokascript/ 2>/dev/null || echo "No @lokascript symlinks yet"

      - name: Rebuild workspace links
        run: |
          # Remove stale workspace symlinks and reinstall
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      - name: Lint (oxlint)
        run: npm run lint

      # "all packages" is now literally true. This step named eleven of the
      # forty-four packages that declare a `typecheck` script, so a type error
      # in any of the other thirty-three stayed green forever — including
      # framework, semantic's own downstream domain packages, and every
      # non-built package (testing-framework, the two vscode extensions).
      # The list is GUARDED by scripts/check-ci-job-lists.cjs.
      #
      # Cost measured 2026-08-01 before expanding: all 44 take ~27s locally vs
      # ~9s for the 11 — tsc is cheap on packages this size, and the gap was
      # coverage nobody was paying for. The first eleven keep their original
      # order (biggest first, so a break in core surfaces fastest); the rest
      # are alphabetical.
      - name: Typecheck all packages
        run: |
          npm run typecheck --prefix packages/core
          npm run typecheck --prefix packages/semantic
          npm run typecheck --prefix packages/i18n
          npm run typecheck --prefix packages/hyperscript-adapter
          npm run typecheck --prefix packages/htmx-adapter
          npm run typecheck --prefix packages/vite-plugin
          npm run typecheck --prefix packages/patterns-reference
          npm run typecheck --prefix packages/aot-compiler
          npm run typecheck --prefix packages/compilation-service
          npm run typecheck --prefix packages/mcp-server
          npm run typecheck --prefix packages/language-server
          npm run typecheck --prefix packages/behaviors
          npm run typecheck --prefix packages/developer-tools
          npm run typecheck --prefix packages/domain-bdd
          npm run typecheck --prefix packages/domain-behaviorspec
          npm run typecheck --prefix packages/domain-config
          npm run typecheck --prefix packages/domain-flow
          npm run typecheck --prefix packages/domain-jsx
          npm run typecheck --prefix packages/domain-learn
          npm run typecheck --prefix packages/domain-llm
          npm run typecheck --prefix packages/domain-sql
          npm run typecheck --prefix packages/domain-todo
          npm run typecheck --prefix packages/domain-toolkit
          npm run typecheck --prefix packages/domain-voice
          npm run typecheck --prefix packages/framework
          npm run typecheck --prefix packages/hyperscript-tools-i18n
          npm run typecheck --prefix packages/intent
          npm run typecheck --prefix packages/intent-element
          npm run typecheck --prefix packages/language-server-hyperscript
          npm run typecheck --prefix packages/mcp-multilingual-intent
          npm run typecheck --prefix packages/multilingual-hyperscript
          npm run typecheck --prefix packages/planner
          npm run typecheck --prefix packages/reactivity
          npm run typecheck --prefix packages/realtime
          npm run typecheck --prefix packages/server-bridge
          npm run typecheck --prefix packages/smart-bundling
          npm run typecheck --prefix packages/testing-framework
          npm run typecheck --prefix packages/types-browser
          npm run typecheck --prefix packages/vscode-extension
          npm run typecheck --prefix packages/vscode-extension-hyperscript

      # The main tsconfig includes only src/**, so packages/core/scripts/ was
      # typechecked by nothing — that is how the doc generators kept importing
      # deleted commands (persist/bind) for six months while crashing on every
      # run. This gate makes a broken maintenance script fail loudly.
      - name: Typecheck core scripts
        run: npm run typecheck:scripts --prefix packages/core

      # Committed generated artifacts drift silently when profiles change: both
      # of these were stale across all 24 languages. Their generators are now
      # prettier-idempotent, so a fresh run is byte-identical to the committed
      # file and these checks are exact.
      # `docs:commands:check` joined them in Arc B step 4b. Its generator had the
      # same two defects these had: it emitted unpadded markdown tables that the
      # pre-commit hook then padded (so a fresh run showed a 252-line diff of pure
      # column padding with identical content), and a `Generated: <ISO>` line that
      # made any whole-file comparison fail on every run. Both are fixed, so this
      # check is exact too. Coverage of the generator's command table is a separate
      # gate — src/commands/__tests__/docs-coverage.test.ts, in the unit suite.
      # `generate:bundles:check` joined in Arc E step 4. It regenerates the
      # executor-core regions of the committed browser bundles from
      # `bundle-generator/templates.ts` and fails if the result differs — the
      # drift guard that lets hybrid-complete's `executeCommand` switch stop
      # being a hand-maintained second copy of the templates. Same
      # prettier-idempotency requirement as the three above: the generator
      # formats with the pinned prettier before writing, so a fresh run is
      # byte-identical to the committed file.
      # `check:mapper-parity` joined in Arc F step 1. It regenerates the
      # command-mapper parity fixture — the oracle proving a command migrated
      # from a hand-written mapper to a declarative schema `ast` descriptor
      # emits a byte-identical AST — and fails if the result differs. The
      # vitest gate (test/mapper-parity.test.ts) asserts the CODE matches the
      # fixture; this asserts the FIXTURE matches what the generator emits, so
      # a hand-edited fixture (a case quietly deleted) cannot pass unnoticed.
      - name: Check generated artifacts are in sync
        run: |
          npm run check:grammar --prefix packages/semantic
          npm run check:mapper-parity --prefix packages/semantic
          npm run check:keywords --prefix packages/vite-plugin
          npm run docs:commands:check --prefix packages/core
          npm run generate:bundles:check --prefix packages/core

      - name: Verify reference data
        run: npm run verify:reference --prefix packages/core

      # NOTE: `npm run lint:domains` deliberately does NOT run here. It is
      # `npm test --prefix packages/domain-<x> -- --run lint`, i.e. vitest, and
      # each domain's vitest include is `src/**/*.test.ts` — which already
      # contains src/__test__/lint.test.ts. The unit-tests job therefore runs all
      # nine domain lint suites; invoking them here too paid for nine extra
      # vitest boots and nine ensure-fresh passes for zero additional coverage.
      # The root script is kept for local use.

  # ============================================
  # Job 4: Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build, bundles, changes]
    # PR-only (see export-validation): redundant on push under `strict`.
    # Also gated on `code`: a docs/examples-only PR ran the entire 27-package
    # suite for nothing (the shipped-sources gate is what covers those trees,
    # and it stays ungated). A skipped required check satisfies branch protection.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Download browser bundles
        uses: actions/download-artifact@v8
        with:
          # Three shards, merged back into the dist they were split out of.
          pattern: browser-bundles-*
          merge-multiple: true
          path: packages/core/dist

      - name: Rebuild workspace links
        run: |
          # Remove stale workspace symlinks and reinstall
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      # Note: vitest with pool:'forks' may hang after tests complete due to
      # esbuild daemon keeping worker processes alive. The timeout wrapper
      # kills the process after 5 minutes and treats exit code 124 (timeout)
      # as success, since the tests themselves completed.
      - name: Test core
        # The core `test` script (scripts/vitest-run.sh) judges pass/fail from
        # the reporter summary, so it handles the esbuild post-run daemon hang
        # correctly: a benign 124 AFTER tests complete is a PASS, but a mid-run
        # hang (no summary) or any failing test is a real FAIL. Trust its exit
        # code — do NOT blanket-treat 124 as success (that previously masked a
        # hung suite and hid every failure behind a false green).
        run: npm test --prefix packages/core

      - name: Test semantic
        run: npm test --prefix packages/semantic

  # ============================================
  # Job 4b: Unit Tests (packages)
  #
  # Split from `unit-tests` on 2026-07-30. That job was 3m30s, of which 162s
  # was test work and 39s setup — and the test work is dominated by two
  # packages: core 64s and semantic 23s. The other ~25 packages together came
  # to ~75s, most of it vitest/npm startup rather than test execution, run as
  # sequential steps on one runner.
  #
  # So the split is by MEASURED cost, not package count: `unit-tests` keeps
  # core + semantic (~87s), this job takes the remaining ~25 (~75s). Both are
  # required checks; a package must appear in exactly one of them.
  # ============================================
  unit-tests-packages:
    name: Unit Tests (packages)
    runs-on: ubuntu-latest
    needs: [build, bundles, changes]
    # PR-only (see export-validation): redundant on push under `strict`.
    # Also gated on `code`: a docs/examples-only PR ran the entire 27-package
    # suite for nothing (the shipped-sources gate is what covers those trees,
    # and it stays ungated). A skipped required check satisfies branch protection.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Download browser bundles
        uses: actions/download-artifact@v8
        with:
          # Three shards, merged back into the dist they were split out of.
          pattern: browser-bundles-*
          merge-multiple: true
          path: packages/core/dist

      - name: Rebuild workspace links
        run: |
          # Remove stale workspace symlinks and reinstall
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      # Note: vitest with pool:'forks' may hang after tests complete due to
      # esbuild daemon keeping worker processes alive. The timeout wrapper
      # kills the process after 5 minutes and treats exit code 124 (timeout)
      # as success, since the tests themselves completed.
      - name: Test i18n
        run: npm test --prefix packages/i18n

      - name: Test hyperscript-tools-i18n
        # pretest (ensure-fresh + build) builds this package's dist in-job;
        # its only workspace dep (@lokascript/i18n) comes from build-artifacts.
        run: npm test --prefix packages/hyperscript-tools-i18n

      - name: Test hyperscript-adapter
        run: npm test --prefix packages/hyperscript-adapter

      - name: Test htmx-adapter
        run: npm test --prefix packages/htmx-adapter

      - name: Test vite-plugin
        run: npm test --prefix packages/vite-plugin

      - name: Initialize patterns-reference database
        # Use db:init:force because patterns.db is committed to the repo
        # (per packages/patterns-reference/.gitignore `!data/patterns.db`),
        # so the bare db:init bails with "Database already exists".
        run: npm run db:init:force --prefix packages/patterns-reference

      - name: Test patterns-reference
        run: npm test --prefix packages/patterns-reference

      - name: Test aot-compiler
        run: npm test --prefix packages/aot-compiler

      - name: Test compilation-service
        run: npm test --prefix packages/compilation-service

      - name: Test mcp-server
        run: npm test --prefix packages/mcp-server

      - name: Test mcp-multilingual-intent
        run: npm test --prefix packages/mcp-multilingual-intent -- --run

      - name: Test domain-bdd
        run: npm test --prefix packages/domain-bdd

      - name: Test domain-sql
        run: npm test --prefix packages/domain-sql

      - name: Test domain-jsx
        run: npm test --prefix packages/domain-jsx

      - name: Test domain-todo
        run: npm test --prefix packages/domain-todo

      - name: Test domain-behaviorspec
        run: npm test --prefix packages/domain-behaviorspec

      - name: Test domain-llm
        run: npm test --prefix packages/domain-llm

      - name: Test domain-flow
        run: npm test --prefix packages/domain-flow

      - name: Test domain-voice
        run: npm test --prefix packages/domain-voice

      - name: Test domain-learn
        run: npm test --prefix packages/domain-learn

      - name: Test domain-config
        run: npm test --prefix packages/domain-config

      - name: Test language-server
        run: npm test --prefix packages/language-server -- --run

      - name: Test reactivity
        run: npm test --prefix packages/reactivity -- --run

      - name: Test realtime
        run: npm test --prefix packages/realtime -- --run

      # In the local test:check gate (scripts/test-check-all.sh) since the
      # beginning, but never enumerated here — so the express 4 → 5 major broke
      # all 26 dev-server tests (`'*.html'` is not a valid path-to-regexp v8
      # route) and CI stayed green while every local run failed. This job's
      # package list is hand-maintained; when adding a package to the local
      # gate, add it here too.
      - name: Test developer-tools
        run: npm test --prefix packages/developer-tools -- --run

      # The rest of the #857 burn-down: nine more packages that were in the
      # local test:check gate but had never been enumerated here, so CI ran
      # none of their ~78 test files. `scripts/check-ci-test-list.cjs` now
      # fails if a package with a "test:check" script is missing from this job.
      # All nine add ~10s of test work; none needs setup beyond the build
      # artifacts this job already downloads.
      - name: Test framework
        run: npm test --prefix packages/framework -- --run

      - name: Test server-bridge
        run: npm test --prefix packages/server-bridge -- --run

      - name: Test behaviors
        run: npm test --prefix packages/behaviors

      - name: Test smart-bundling
        run: npm test --prefix packages/smart-bundling -- --run

      - name: Test intent
        run: npm test --prefix packages/intent

      - name: Test intent-element
        run: npm test --prefix packages/intent-element

      - name: Test domain-toolkit
        run: npm test --prefix packages/domain-toolkit -- --run

      - name: Test planner
        run: npm test --prefix packages/planner

      # Ten of testing-framework's thirteen files ran in NO job. The three
      # that did are invoked by id elsewhere — shipped-sources-validity in the
      # `shipped-sources` job, canonical-validity + foreign-canonical-validity
      # in `multilingual-validation` — so the package's own suite (assertions,
      # runner, fidelity, vocab, the R2 execution-validator lock) was never
      # run. Safe without a populate step: the one DB-dependent gate
      # self-skips unless FOREIGN_CANONICAL_VALIDITY=1, which only
      # `test:canonical` sets, after populating. The shipped-examples gate
      # walks the git-TRACKED examples/ corpus, so it sees the same tree here
      # as on any dev machine.
      - name: Test testing-framework
        run: npm test --prefix packages/testing-framework

  # ============================================
  # Job 5: Coverage Report (nightly / manual)
  # Was push-to-main. Under `strict` branch protection the post-merge tree IS the
  # tree the PR validated, so this re-ran the full core + semantic + i18n +
  # language-server suites (430 files) a second time per merge just to produce a
  # Codecov datapoint. Nightly keeps the trend without the duplicate execution.
  # ============================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [build, bundles]
    # The `!cancelled()` is REQUIRED, and its absence was a real bug: this job
    # skipped on a workflow_dispatch run even though the event matched and `build`
    # succeeded (verified 2026-07-29, run 30493248972 — 0 steps executed). GitHub's
    # skip propagation is TRANSITIVE: `changes` is skipped on schedule/dispatch, and
    # every job in that needs-closure inherits an implicit `success()` over it unless
    # it carries its own status function. `build` had one; this job did not, so the
    # whole nightly chain silently did nothing while the run still reported success.
    # `needs.build.result == 'success'` restores the dependency check that
    # `!cancelled()` opts out of, so a broken build still stops us.
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Download browser bundles
        uses: actions/download-artifact@v8
        with:
          # Three shards, merged back into the dist they were split out of.
          pattern: browser-bundles-*
          merge-multiple: true
          path: packages/core/dist

      - name: Rebuild workspace links
        run: |
          # Remove stale workspace symlinks and reinstall
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      # NOTE: the four "Generate coverage" steps use `continue-on-error: true` and
      # the four "Upload" steps use `if: ${{ !cancelled() }}`. Rationale: a single
      # flaky suite (e.g. a timing-based perf test) must NOT skip every Codecov
      # upload. Without this, one flake + `carryforward: true` (codecov.yml) makes
      # Codecov silently serve a STALE report for all flags, depressing the number.
      # `fail_ci_if_error: false` stays so a Codecov-side hiccup never fails the job.
      - name: Generate coverage - core
        continue-on-error: true
        # test:coverage uses scripts/vitest-run.sh, which judges pass/fail from
        # the reporter summary (benign post-run 124 = PASS; mid-run hang or any
        # failure = FAIL). Trust its exit code; give it a longer timeout since
        # coverage instrumentation is slower than a plain run.
        run: VITEST_TIMEOUT=300 npm run test:coverage --prefix packages/core

      - name: Generate coverage - semantic
        continue-on-error: true
        run: npm test --prefix packages/semantic -- --coverage

      - name: Generate coverage - i18n
        continue-on-error: true
        run: npm run test:coverage --prefix packages/i18n

      - name: Upload core coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: packages/core/coverage/lcov.info
          flags: core
          name: core-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload semantic coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: packages/semantic/coverage/lcov.info
          flags: semantic
          name: semantic-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload i18n coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: packages/i18n/coverage/lcov.info
          flags: i18n
          name: i18n-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Generate coverage - language-server
        continue-on-error: true
        run: npm test --prefix packages/language-server -- --coverage

      - name: Upload language-server coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: packages/language-server/coverage/lcov.info
          flags: language-server
          name: language-server-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ============================================
  # Job 6: Browser Tests (Playwright)
  # ============================================
  # Slim post-merge: this job already ran against the merged-as-PR code.
  # Re-running it on `push` to main/develop only catches merge skew, which
  # is rare and which `build` + `unit-tests` cover for the vast majority
  # of cases. Skipping it post-merge saves ~30 min runner time per merge.
  browser-tests:
    name: Browser Tests
    runs-on: ubuntu-latest
    needs: [build, bundles, changes]
    # Heavy job: PR-only AND only when non-doc files changed (skips doc PRs).
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Download browser bundles
        uses: actions/download-artifact@v8
        with:
          # Three shards, merged back into the dist they were split out of.
          pattern: browser-bundles-*
          merge-multiple: true
          path: packages/core/dist

      - name: Rebuild workspace links
        run: |
          # Remove stale workspace symlinks and reinstall
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      - name: Verify browser test artifacts
        run: |
          echo "=== Semantic bundle check ==="
          ls -la packages/semantic/dist/browser.global.js || echo "MISSING: browser.global.js"
          echo "=== Core bundle check ==="
          ls -la packages/core/dist/hyperfixi.js || echo "MISSING: hyperfixi.js"
          ls -la packages/core/dist/hyperfixi-multilingual.js || echo "MISSING: hyperfixi-multilingual.js"
          ls -la packages/core/dist/hyperfixi-hybrid-complete.js || echo "MISSING: hyperfixi-hybrid-complete.js"
          echo "=== i18n bundle check ==="
          ls -la packages/i18n/dist/lokascript-i18n.min.js || echo "MISSING: lokascript-i18n.min.js"

      - name: Run Playwright tests
        run: npx playwright test --project=quick
        working-directory: packages/core

      - name: Run htmx-adapter e2e (real htmx v4/v2 + _hyperscript)
        run: npx playwright test
        working-directory: packages/htmx-adapter

      - name: Run hyperscript-adapter e2e (real _hyperscript, vendored)
        run: npx playwright test
        working-directory: packages/hyperscript-adapter

      # NOTE: paths are relative to the repo root, NOT this job's
      # working-directory. The report/traces are written under
      # packages/core/ (the Playwright cwd), so the path must be
      # `packages/core/...` — a bare `./core/...` resolves to a
      # nonexistent repo-root dir and silently uploads nothing.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: packages/core/playwright-report/
          retention-days: 3

      # Traces (trace: 'on-first-retry') + error-context land in test-results/.
      # Without this, a failing run leaves nothing to inspect — which is exactly
      # why the semantic-bundle load flake went undiagnosed for so long.
      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-traces
          path: packages/core/test-results/**
          retention-days: 3
          if-no-files-found: ignore

  # ============================================
  # Job 7: Multilingual Validation
  # ============================================
  # Slim post-merge: PR-only. See note on browser-tests above.
  multilingual-validation:
    name: Multilingual Validation
    runs-on: ubuntu-latest
    needs: [build, changes]
    # Heavy job: PR-only AND only when non-doc files changed (skips doc PRs).
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Rebuild workspace links
        run: |
          # Remove stale workspace symlinks and reinstall
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      - name: Populate patterns database
        run: npm run populate --prefix packages/patterns-reference

      # Vocab cross-surface consistency (Arc A — docs-internal/archive/handoffs/HANDOFF_vocab-consistency.md).
      # GATING since Batch 4 (release bar item 1): exits 1 on any unwaived
      # error-tier finding. Waivers (probe-cited) live in
      # packages/testing-framework/vocab-waivers.json.
      - name: Vocab consistency (gate)
        run: |
          cd packages/testing-framework
          npx tsx src/vocab/cli.ts validate

      # NOTE: the former "quick mode" step (--languages en,ja,ko,es,zh,ar --quick)
      # is deliberately gone. It was a STRICT SUBSET of the full step below and
      # bought no signal: --quick is a deterministic slice(0, 10) per language of
      # the very same corpus (pattern-loader.ts samplePatterns, 'stratified' —
      # no shuffle), its six languages are all inside the full step's list, and
      # the committed baseline records all six at parseRate 1.000 across all 154
      # patterns. So its "absolute 100%" assertion is implied by the full step's
      # R5 per-pattern ratchet, which fails at tolerance 0 when ANY
      # baseline-passing pattern stops parsing. Quick mode remains useful locally
      # for fast iteration: add --quick to the command below.

      # Full mode is 154 patterns/lang, and the committed baseline now records
      # every one of the 24 languages at parseRate 1.000 (the historical ~85%
      # coverage gap, with HE/TL/AR/KO as laggards, was closed by the fidelity
      # arcs). This step gates on REGRESSION vs that baseline, on ten signals.
      # Two are worth naming here: a language fails if its parse rate drops >2pts,
      # AND — at tolerance 0 — if any single pattern that parsed in the baseline
      # no longer parses (R5; the rate alone cannot see a handful of patterns
      # breaking, since one flip is only ~0.65pt). It also ratchets parse
      # *fidelity* at tolerance 0: ANY faithful baseline pass that becomes lossy
      # (still parses, but silently drops ≥1 command) fails the gate — that
      # cushion was measured to be where a real single-pattern regression hid.
      # A >50% structure loss (degenerate) keeps a cushion of 3 —
      # see the "Multilingual parse rate ≠ fidelity" note in CLAUDE.md. Regenerate the
      # baseline after an INTENTIONAL coverage change — IMPORTANT: populate first
      # so the DB matches CI:
      #   npm run populate --prefix packages/patterns-reference
      #   cd packages/testing-framework && npx tsx src/multilingual/cli.ts \
      #     --languages <…> --full --bundle browser-priority --save-baseline \
      #     --baseline ./baselines/multilingual-priority.json
      # QU (Quechua), BN (Bengali), MS (Malay) are excluded — under development.
      - name: Test supported languages (full mode, regression gate)
        run: |
          cd packages/testing-framework
          npx tsx src/multilingual/cli.ts --languages ar,de,en,es,fr,he,hi,id,it,ja,ko,pl,pt,ru,sw,th,tl,tr,uk,vi,zh --full --bundle browser-priority --regression --baseline ./baselines/multilingual-priority.json

      # Canonical-validity gates: render every corpus EN reference (canonical-validity)
      # AND every authored foreign translation (foreign-canonical-validity) to English,
      # then parse the result on the real hyperscript.org engine — failing on any
      # invalid render outside the committed allowlists. These are testing-framework
      # vitest tests, so they run HERE (not in unit-tests, which never runs
      # testing-framework vitest) because the foreign gate needs the populated
      # translations table (populated above).
      - name: Canonical-validity gates (en-render + foreign→English)
        run: npm run test:canonical --prefix packages/testing-framework

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multilingual-test-results
          path: ./testing-framework/test-results/
          retention-days: 3

  # ============================================
  # Job 8: Bundle Size Analysis
  # ============================================
  # Slim post-merge: PR-only. The size report on a PR is what reviewers
  # actually look at; the post-merge repeat against an identical artifact
  # has no readers. Pre-publish-check.yml still gates bundle sizes at
  # publish time as a final guard.
  bundle-size:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    needs: [build, bundles, changes]
    # Heavy job: PR-only AND only when non-doc files changed (skips doc PRs).
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Download browser bundles
        uses: actions/download-artifact@v8
        with:
          # Three shards, merged back into the dist they were split out of.
          pattern: browser-bundles-*
          merge-multiple: true
          path: packages/core/dist

      - name: Rebuild workspace links
        run: |
          # Remove stale workspace symlinks and reinstall
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      # Both gates below were local-only tools before the 2026-07-20 audit —
      # metadata.ts sizes drifted ~110 KB stale and the headline slim bundles
      # had zero size-regression coverage because nothing in CI ran them.

      # metadata.ts (public export @hyperfixi/core/metadata) is a published DOC
      # STRING, not a regression gate. It fails only when it has drifted more
      # than ±2% from the built dist — enough to catch the ~110 KB rot the audit
      # found, loose enough that ordinary code changes pass. (It used to compare
      # formatted strings for EXACT equality, i.e. it fired on ~102 gzip bytes,
      # so every code PR needed an extra round-trip for it alone.)
      #
      # WHICH GATE BLOCKED YOU:
      #   this step        -> metadata.ts is stale. Copy the "actual" columns
      #                       FROM THIS LOG into packages/core/src/metadata.ts.
      #                       Do NOT run `update:sizes:auto` locally: dist/ is
      #                       untracked and gzip is platform-dependent.
      #   next step (±5%)  -> a real size regression. Investigate tree-shaking
      #                       or duplication; do not re-baseline reflexively.
      #   "Check size limits" -> an absolute ceiling; a bundle got big enough to
      #                       matter to users.
      - name: Metadata size check (update:sizes)
        run: npm run update:sizes --prefix packages/core

      # ±5% regression gate against scripts/bundle-snapshots/baseline.json.
      # --skip-build measures the build-artifact bundles; hyperfixi-classic.js
      # is the one baseline bundle the default build:browser set omits, so
      # build it here first.
      - name: Bundle-size snapshot gate
        run: |
          npm run build:browser:classic --prefix packages/core
          node packages/core/scripts/bundle-size-snapshot.mjs --check --skip-build

      - name: Analyze bundle sizes
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Core Bundles" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|---------|" >> $GITHUB_STEP_SUMMARY

          for file in packages/core/dist/hyperfixi*.js; do
            if [[ -f "$file" && ! "$file" == *.map ]]; then
              filename=$(basename "$file")
              size=$(wc -c < "$file" | tr -d ' ')
              gzip_size=$(gzip -c "$file" | wc -c | tr -d ' ')
              size_kb=$((size / 1024))
              gzip_kb=$((gzip_size / 1024))
              echo "| $filename | ${size_kb} KB | ${gzip_kb} KB |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Semantic Bundles" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|---------|" >> $GITHUB_STEP_SUMMARY

          for file in packages/semantic/dist/browser*.js; do
            if [[ -f "$file" && ! "$file" == *.map ]]; then
              filename=$(basename "$file")
              size=$(wc -c < "$file" | tr -d ' ')
              gzip_size=$(gzip -c "$file" | wc -c | tr -d ' ')
              size_kb=$((size / 1024))
              gzip_kb=$((gzip_size / 1024))
              echo "| $filename | ${size_kb} KB | ${gzip_kb} KB |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Check size limits
        run: |
          # Size limits (gzipped bytes), aligned with pre-publish-check.yml.
          # Until the 2026-07-20 pre-release audit this step initialized
          # failed=0, emitted ::warning:: on breach, and never set failed=1 —
          # `exit $failed` could not fail, and the stale 230 KB browser cap
          # (pre-dedupe "~203-208 KB" era) was being silently exceeded by the
          # real ~299 KB gz bundle. The browser/hx-v4 ceilings exist to catch
          # RE-duplication (the #616 double core+semantic class).
          MAX_LITE=4000           # 4 KB   (actual ~2 KB)
          # Raised 20000 → 24000 in Arc E step 4, which closed Finding 17: the
          # hybrid bundles used to PARSE 35 commands and EXECUTE 24, and adding
          # the missing eleven cost hybrid-complete +2969 B gz / hx +2977 B gz
          # (measured, not estimated). 2057 of that is `morphlex`, pulled in by
          # the `morph` case — 69% of the increase for 1 of 13 commands, kept
          # deliberately so no advertised command is a no-op.
          # hx measured 21960 B gz locally, so 22000 would have failed on the
          # first run; 24000 restores roughly the ~2 KB of headroom the old
          # ceiling had. Mirrored in ci.yml and pre-publish-check.yml.
          MAX_HYBRID=24000        # 24 KB  (hybrid-hx actual ~22.0 KB gz)
          MAX_BROWSER=340000      # 340 KB (hyperfixi.js actual ~299 KB gz post-dedupe)
          MAX_HXV4=350000         # 350 KB (hyperfixi-hx-v4.js actual ~311 KB gz post-dedupe)

          failed=0

          if [[ -f "packages/core/dist/hyperfixi-lite.js" ]]; then
            size=$(gzip -c packages/core/dist/hyperfixi-lite.js | wc -c | tr -d ' ')
            if [[ "$size" -gt "$MAX_LITE" ]]; then
              echo "::error::hyperfixi-lite.js ($size bytes gzip) exceeds limit ($MAX_LITE bytes)"
              failed=1
            else
              echo "hyperfixi-lite.js: $size bytes gzip (limit $MAX_LITE)"
            fi
          fi

          # hyperfixi-hx.js shares the hybrid ceiling; it is listed explicitly
          # because its filename matches no hyperfixi-hybrid-* glob (the same
          # naming gap that once left hx-v4 unchecked in pre-publish-check).
          for bundle in hyperfixi-hybrid-complete.js hyperfixi-hx.js; do
            if [[ -f "packages/core/dist/$bundle" ]]; then
              size=$(gzip -c "packages/core/dist/$bundle" | wc -c | tr -d ' ')
              if [[ "$size" -gt "$MAX_HYBRID" ]]; then
                echo "::error::$bundle ($size bytes gzip) exceeds limit ($MAX_HYBRID bytes)"
                failed=1
              else
                echo "$bundle: $size bytes gzip (limit $MAX_HYBRID)"
              fi
            fi
          done

          # Full bundles are NOT [[ -f ]]-skipped: the build job runs
          # build:browser, so a missing file means the bundle build silently
          # failed upstream — that must fail here, not skip.
          if [[ -f "packages/core/dist/hyperfixi.js" ]]; then
            size=$(gzip -c packages/core/dist/hyperfixi.js | wc -c | tr -d ' ')
            if [[ "$size" -gt "$MAX_BROWSER" ]]; then
              echo "::error::hyperfixi.js ($size bytes gzip) exceeds limit ($MAX_BROWSER bytes)"
              failed=1
            else
              echo "hyperfixi.js: $size bytes gzip (limit $MAX_BROWSER)"
            fi
          else
            echo "::error::hyperfixi.js MISSING from dist — bundle build failed upstream"
            failed=1
          fi

          if [[ -f "packages/core/dist/hyperfixi-hx-v4.js" ]]; then
            size=$(gzip -c packages/core/dist/hyperfixi-hx-v4.js | wc -c | tr -d ' ')
            if [[ "$size" -gt "$MAX_HXV4" ]]; then
              echo "::error::hyperfixi-hx-v4.js ($size bytes gzip) exceeds limit ($MAX_HXV4 bytes)"
              failed=1
            else
              echo "hyperfixi-hx-v4.js: $size bytes gzip (limit $MAX_HXV4)"
            fi
          else
            echo "::error::hyperfixi-hx-v4.js MISSING from dist — bundle build failed upstream"
            failed=1
          fi

          exit $failed

  # ============================================
  # Job 9: MCP Multilingual Intent — demos + compat test
  # ============================================
  # Starts the Hono Siren API in background, runs the Siren-compat test
  # and the three IDE integration demos (EN ≡ JA/AR/KO schema equivalence).
  # Captures demo output as an artifact so the landing page can embed it.
  # Reuses build artifacts from Job 1 — no rebuild cost.
  #
  # Slim post-merge: PR-only. The committed `demo-output.txt` staleness
  # check is what matters here, and it already ran on the PR. Re-running
  # against the merged code produces the same output (deterministic
  # demos against the same build artifacts).
  mcp-demos:
    name: MCP Multilingual Demos
    runs-on: ubuntu-latest
    needs: [build, changes]
    # Heavy job: PR-only AND only when non-doc files changed (skips doc PRs).
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Rebuild workspace links
        run: |
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      - name: Start Hono Siren server
        working-directory: packages/mcp-multilingual-intent
        run: |
          nohup npm run dev > /tmp/mcp-server.log 2>&1 &
          echo $! > /tmp/mcp-server.pid
          # Wait up to ~15s for /health to return 200
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3030/health > /dev/null 2>&1; then
              echo "server up after ${i} tries"
              break
            fi
            sleep 0.5
          done
          curl -fsS http://localhost:3030/health || {
            echo "server failed to start"; cat /tmp/mcp-server.log; exit 1;
          }

      - name: Run Siren compatibility test
        run: npm run mcp:test --prefix packages/mcp-multilingual-intent

      - name: Run IDE integration demos (capture output)
        run: npm run demos:capture --prefix packages/mcp-multilingual-intent

      - name: Check committed demo-output.txt is up to date
        run: |
          # Fail the job if the committed landing-page artifact drifts from
          # what the demos actually produce. To fix: run
          # `npm run demos:capture --prefix packages/mcp-multilingual-intent`
          # locally and commit the updated file.
          if ! git diff --exit-code --stat \
            packages/mcp-multilingual-intent/landing/demo-output.txt; then
            echo "::error::demo-output.txt is out of date. Run 'npm run demos:capture --prefix packages/mcp-multilingual-intent' and commit the result."
            exit 1
          fi

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/mcp-server.pid ]; then
            kill "$(cat /tmp/mcp-server.pid)" 2>/dev/null || true
          fi

      - name: Upload demo output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-demo-output
          path: packages/mcp-multilingual-intent/landing/demo-output.txt
          retention-days: 7

  # ============================================
  # Job 10: LSE protocol conformance (4 reference parsers)
  #
  # protocol/ lives outside the npm workspaces, so `build` and `unit-tests` never
  # touch it. A grammar change must land identically in TypeScript, Python, Go and
  # Rust (protocol/docs/boundary.md Rule 3); without this job that fork is silent.
  #
  # Gated on `paths: protocol/**`, so it costs nothing on an ordinary PR.
  # fail-fast: false so all four report independently — for a cross-language
  # grammar change, knowing *which* parsers disagree is the whole signal.
  # ============================================
  protocol-conformance:
    name: Protocol Conformance (${{ matrix.lang }})
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.protocol == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lang: [typescript, go]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        if: matrix.lang == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: TypeScript conformance
        if: matrix.lang == 'typescript'
        working-directory: protocol/typescript
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Setup Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
      - name: Go conformance
        if: matrix.lang == 'go'
        working-directory: protocol/go
        run: go test ./...

  # ============================================
  # Job 10.5: Go client build + test
  #
  # clients/go-client lives outside the npm workspaces, so no other job
  # compiles it — its weekly gomod Dependabot PRs were "green" without a line
  # of Go ever building. Gated on clients/go-client/**, so it costs ~0 on an
  # ordinary PR and ~40s on the PRs it exists for.
  # ============================================
  go-client:
    name: Go Client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.goclient == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: clients/go-client/go.mod
          cache-dependency-path: clients/go-client/go.sum

      - name: Build
        working-directory: clients/go-client
        run: go build ./...

      - name: Test
        working-directory: clients/go-client
        run: go test ./...

  # ============================================
  # Job 11: Performance Benchmarks (nightly / manual)
  # Trend tracking, never a gate (continue-on-error). Moved off push-to-main
  # alongside coverage — see that job's note.
  # ============================================
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build
    # `!cancelled()` required for the same transitive skip-propagation reason as the
    # coverage job — see the comment there.
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Rebuild workspace links
        run: |
          # Remove stale workspace symlinks and reinstall
          rm -rf node_modules/@hyperfixi node_modules/@lokascript
          npm install

      # `bench:ci`, not `bench:run`: only the former writes a results file
      # (--reporter=json --outputFile=benchmark-results/latest.json). This job
      # ran `bench:run`, which writes nothing, and then uploaded from
      # ./core/benchmark-results/ — a path that does not exist (the real one is
      # packages/core/benchmark-results/). Both halves of the trend-tracking
      # output were therefore discarded; the job burned its budget for nothing.
      - name: Run benchmarks
        run: npm run bench:ci --prefix packages/core
        # Kept non-fatal deliberately: benchmarks have no pass/fail thresholds, so a
        # slow machine must never fail the run, and `vitest bench` is also exposed to
        # the known post-run esbuild daemon hang. But see the next step — this flag is
        # what let a TOTAL startup failure sit unnoticed, so the output is now asserted
        # separately.
        continue-on-error: true

      # `continue-on-error` above cannot distinguish "benchmarks ran and were slow"
      # from "benchmarks never ran". It was the latter: `bench:ci` used
      # `--reporter=json`, which vitest 4 tries to resolve as a CUSTOM reporter module
      # in bench mode and dies with "Failed to load custom Reporter from json". The
      # job still reported success, and the upload silently picked up two COMMITTED
      # 2025-12-05 files, so the artifact looked healthy at 1.5 KB while containing
      # seven-month-old data. This step makes that failure mode loud without making a
      # slow benchmark fatal. A real report is ~30 KB.
      - name: Verify benchmark output was produced
        run: |
          f=packages/core/benchmark-results/latest.json
          if [ ! -s "$f" ]; then
            echo "::error::$f missing or empty — bench:ci did not produce a report."
            exit 1
          fi
          bytes=$(wc -c <"$f")
          echo "benchmark report: $bytes bytes"
          if [ "$bytes" -lt 1000 ]; then
            echo "::error::$f is only $bytes bytes — implausibly small for a report."
            exit 1
          fi
          node -e "const j=require('./$f'); if(!j.files?.length) { console.error('no benchmark files in report'); process.exit(1); } console.log('files:', j.files.length)"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: packages/core/benchmark-results/
          retention-days: 3
          if-no-files-found: warn

  # ============================================
  # Job 12: CI Gate — the one required check
  #
  # Added 2026-07-30 with the `bundles` split, because that split introduced a
  # way for a PR to merge on a broken tree.
  #
  # Branch protection requires six checks BY NAME (Build All Packages, Lint &
  # Typecheck, Unit Tests, Export Validation, Multilingual Validation, Browser
  # Tests). That list is safe only while every one of them runs directly off
  # `build`. Now that four of them also `needs: bundles`, a FAILING bundle shard
  # SKIPS them — and a skipped required check SATISFIES branch protection (this
  # repo depends on that behaviour for doc-only PRs). So a bundle build that
  # failed to compile would have gone green-by-omission.
  #
  # This job collapses the whole graph into a single status. `skipped` stays
  # acceptable — that is the path-gating mechanism working — but `failure` and
  # `cancelled` anywhere fail here, including in a matrix leg that no by-name
  # required check could ever cover.
  #
  # >>> To adopt: make "CI Gate" the ONLY required status check on `main`. <<<
  # Leaving the six in place as well is harmless but redundant; removing them
  # without adding this one would leave the hole described above.
  #
  # `coverage` and `benchmarks` are deliberately NOT in `needs`: they are
  # nightly-only, non-required trend jobs, and gating merges on them would make
  # a slow benchmark block a PR.
  # ============================================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - build
      - bundles
      - shipped-sources
      - export-validation
      - lint-typecheck
      - unit-tests
      - unit-tests-packages
      - browser-tests
      - multilingual-validation
      - bundle-size
      - mcp-demos
      - protocol-conformance
      - go-client

    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          bad=$(echo "$RESULTS" | jq -r 'to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI Gate: the following jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "CI Gate: every job succeeded or was skipped."
