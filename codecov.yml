codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: '70...100'

  status:
    # Project coverage - informational only (doesn't block PRs)
    project:
      default:
        target: auto
        threshold: 5%
        informational: true
    # Patch coverage - informational for now, can enforce later
    patch:
      default:
        target: 60%
        threshold: 5%
        informational: true

flags:
  core:
    paths:
      - packages/core/src/**
    carryforward: true
  semantic:
    paths:
      - packages/semantic/src/**
    carryforward: true
  i18n:
    paths:
      - packages/i18n/src/**
    carryforward: true
  # The nightly coverage job has uploaded a `language-server` flag since the
  # step was added, but the flag was never declared here — so it got no
  # `paths:` and no `carryforward`, and behaved differently from the three
  # above. scripts/check-ci-job-lists.cjs now fails on either direction of the
  # mismatch (an undeclared uploaded flag, or a declared flag nothing uploads —
  # which `carryforward: true` would make serve its last report forever).
  language-server:
    paths:
      - packages/language-server/src/**
    carryforward: true

comment:
  layout: 'header, diff, flags, components'
  behavior: default
  require_changes: true
